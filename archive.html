<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歷期週報｜交易道中</title><meta name="description" content="交易道中 PTT 熱門標的週報歷期列表"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0d100f;--bg2:#111512;--surface:rgba(19,24,23,.78);--soft:rgba(255,255,255,.03);--border:rgba(255,255,255,.08);
--text:#f3f1ed;--muted:#90968f;--faint:#5c625d;--lime:#acff3f;--tea:#d7ecc5;--powder:#a9b9c5;--risk:#ff6d7d;--blue:#68b8ff;
--display:"Space Grotesk","Noto Sans TC","PingFang TC",sans-serif;--body:"Noto Sans TC","PingFang TC",-apple-system,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font:15px/1.7 var(--body);background:
radial-gradient(circle at 18% 0%,rgba(172,255,63,.08),transparent 32%),linear-gradient(180deg,var(--bg),var(--bg2)) fixed}
.wrap{max-width:1080px;margin:0 auto;padding:40px 16px 64px}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.brand{font:500 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--lime);font-weight:700}
h1{font:700 30px/1.25 var(--display);margin:10px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
h2{display:flex;align-items:center;gap:10px;font:700 18px/1.3 var(--body);margin:44px 0 14px}
h2 .label{font:700 11px/1 var(--display);letter-spacing:.12em;color:var(--lime);border:1px solid rgba(172,255,63,.35);
background:rgba(172,255,63,.08);padding:5px 8px;border-radius:99px}
h2 .count{color:var(--muted);font-weight:400;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 20px 40px rgba(0,0,0,.2);backdrop-filter:blur(8px)}
.conclusion{margin-top:28px;padding:22px 24px;border-left:3px solid var(--lime)}
.conclusion .k{font:700 12px/1 var(--display);letter-spacing:.12em;color:var(--lime);margin-bottom:10px}
.conclusion p{margin:0;font-size:17px;line-height:1.85}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.kpi{padding:16px 18px}.kpi .v{font:700 26px/1.1 var(--display)}.kpi .v small{font-size:14px;color:var(--muted);margin-left:4px}
.kpi .l{color:var(--muted);font-size:12px;margin-top:6px}
.nav{width:100%;border-collapse:collapse}
.nav th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:12px 14px;border-bottom:1px solid var(--border)}
.nav td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.nav tr:last-child td{border-bottom:0}.nav tbody tr{cursor:pointer}.nav tbody tr:hover td{background:rgba(172,255,63,.04)}
.nav .num{text-align:right;font:500 15px var(--display);white-space:nowrap}
.nav .rank{color:var(--faint);font:500 13px var(--display);width:28px}
.nav .name a{color:var(--text)}.nav .name a:hover{color:var(--lime);text-decoration:none}.nav .name b{font-weight:700}.nav .name span{color:var(--muted);font-size:12px;margin-left:6px}
.nav .theme{color:var(--powder);font-size:13px}
.up{color:var(--tea)}.down{color:var(--risk)}.flat{color:var(--powder)}
.ratio{color:var(--lime);font:700 15px var(--display)}
.bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06);min-width:90px}
.bar i{display:block;height:100%}.bar .b{background:var(--tea)}.bar .n{background:rgba(169,185,197,.35)}.bar .s{background:var(--risk)}
.barlabel{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.stock{padding:20px 22px;scroll-margin-top:16px}
.stock header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.stock h3{margin:0;font:700 20px/1.3 var(--body)}.stock h3 span{font:500 14px var(--display);color:var(--muted);margin-left:8px}
.stock .theme{color:var(--powder);font-size:13px;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tag.hot{border-color:rgba(172,255,63,.4);color:var(--lime)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.metric{background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.metric .v{font:700 18px/1.2 var(--display)}.metric .l{font-size:11px;color:var(--muted);margin-top:3px}
.senti{margin-bottom:14px}
.case{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;font-size:14px;margin:8px 0}
.case b{font-weight:500;font-size:12px;padding-top:2px}.case .bull{color:var(--tea)}.case .bear{color:var(--risk)}.case .ver{color:var(--powder)}
.links{border-top:1px solid var(--border);margin-top:14px;padding-top:12px;font-size:13px}
.links a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 12px;border-radius:99px;background:var(--soft);border:1px solid var(--border);font-size:14px}
.chip span{color:var(--muted);font-size:12px;margin-left:6px}
.compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.compact .card{padding:14px 16px}.compact .t{font-weight:700}.compact .t span{color:var(--muted);font:500 12px var(--display);margin-left:6px}
.compact .m{font-size:13px;color:var(--muted);margin-top:4px}
details.card{padding:6px 18px;margin-top:10px}details summary{cursor:pointer;padding:12px 0;color:var(--muted)}
.scroll{overflow-x:auto}table.full{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
table.full th,table.full td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.full th{color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer;position:sticky;top:0;background:#141917}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td.txt{min-width:180px;max-width:320px}
.small{font-size:12px;color:var(--muted)}
.method{margin-top:44px;padding:20px 22px;font-size:13px;color:var(--muted)}.method b{color:var(--text);font-weight:500}
.method ul{margin:8px 0 0;padding-left:18px}.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:28px}
@media (max-width:760px){h1{font-size:24px}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}
.metrics{grid-template-columns:repeat(2,1fr)}.nav .hide-sm{display:none}.nav td,.nav th{padding:10px 8px}
.conclusion p{font-size:16px}}
</style></head><body><div class="wrap"><div class="brand"><b>交易道中</b>　Trading on the way　<a href="./" style="color:var(--muted)">最新一期 →</a></div><h1>歷期週報</h1><div class="sub">PTT 股板熱門標的，每週日更新</div><div style="margin-top:28px"><a class="card" href="2026-09-20_2026-09-26.html" style="display:block;padding:16px 20px;margin-bottom:10px;color:var(--text)"><div style="font:700 16px var(--display)">2026.09.20 – 09.26</div><div class="sub" style="margin-top:4px">先進封裝與 AI 硬體需求升溫，嘉晶、南茂、聯茂本週已大漲。友達分歧在合作傳聞與爆量賣壓，AMD 聚焦 CPU 需求與漲價，宏碁則偏空。</div></a></div><div class="foot">非投資建議，單純分享看法交流<br>也歡迎分享想法，理性討論唷<br><br>交易道中｜@trading_on_the_way</div></div></body></html>
